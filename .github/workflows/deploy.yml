# Publica el frontend en GitHub Pages cada vez que se sube algo a main.
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".
# Mientras no haya backend desplegado, la página usa la API simulada (VITE_USE_MOCK=true).
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Compilar
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_USE_MOCK: "true"
      # GitHub Pages no conoce las rutas de React Router: 404.html = index.html hace que
      # enlaces como /Medverify/empresa/solicitudes funcionen al abrirlos o recargarlos.
      - name: Respaldo para rutas de la app
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
